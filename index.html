<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>System</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="icon-grid">
      <!-- KING -->
      <img
        class="system-icon"
        src="images/king_1.svg"
        data-idle="images/king_1.svg"
        data-active="images/king_2.svg"
        data-sound="sounds/king.mp3"
        data-volume="0.6"
        alt=""
      />

      <!-- QUEEN -->
      <img
        class="system-icon"
        src="images/queen_1.svg"
        data-idle="images/queen_1.svg"
        data-active="images/queen_2.svg"
        data-sound="sounds/queen.mp3"
        data-volume="0.2"
        alt=""
      />

      <!-- KNIGHT -->
      <img
        class="system-icon"
        src="images/knight_1.svg"
        data-idle="images/knight_1.svg"
        data-active="images/knight_2.svg"
        data-sound="sounds/knight.mp3"
        data-volume="0.4"
        alt=""
      />

      <!-- ROOK -->
      <img
        class="system-icon"
        src="images/rook_1.svg"
        data-idle="images/rook_1.svg"
        data-active="images/rook_2.svg"
        data-sound="sounds/rook.mp3"
        data-volume="0.5"
        alt=""
      />

      <!-- BISHOP -->
      <img
        class="system-icon"
        src="images/bishop_1.svg"
        data-idle="images/bishop_1.svg"
        data-active="images/bishop_2.svg"
        data-sound="sounds/bishop.mp3"
        data-volume="0.5"
        alt=""
      />

      <!-- DECK -->
      <img
        class="system-icon"
        src="images/deck_1.svg"
        data-idle="images/deck_1.svg"
        data-active="images/deck_2.svg"
        data-sound="sounds/deck.wav"
        data-volume="0.4"
        alt=""
      />

      <!-- ATTACK -->
      <img
        class="system-icon"
        src="images/attack_1.svg"
        data-idle="images/attack_1.svg"
        data-active="images/attack_2.svg"
        data-sound="sounds/attack.wav"
        data-volume="0.3"
        alt=""
      />

      <!-- TARGET -->
      <img
        class="system-icon"
        src="images/aim_1.svg"
        data-idle="images/aim_1.svg"
        data-active="images/aim_2.svg"
        data-sound="sounds/aim.mp3"
        data-volume="0.5"
        alt=""
      />

      <!-- TURN -->
      <img
        class="system-icon"
        src="images/turn_1.svg"
        data-idle="images/turn_1.svg"
        data-active="images/turn_2.svg"
        data-sound="sounds/turn.mp3"
        data-volume="0.2"
        alt=""
      />
    </main>

    <script src="script.js"></script>
  </body>
</html>
